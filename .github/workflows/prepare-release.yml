name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (preview changelog without committing)'
        type: boolean
        required: false
        default: false
      force:
        description: 'Force rewrite of existing changelog section'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: lattice-prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'sam32j/lattice' || github.repository == 'sam32j/vorssaint-utils'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: lattice/main
          fetch-depth: 0
          token: ${{ secrets.LATTICE_SYNC_TOKEN || github.token }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'

      - name: Run bump-release
        id: bump
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          bun Tools/bump-release.ts $ARGS

      - name: Commit and push changes
        id: commit
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          if git diff --exit-code Downstream/release.json Downstream/CHANGELOG.md > /dev/null 2>&1; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "Lattice Release Bot"
          git config user.email "78013800+sam32j@users.noreply.github.com"
          git add Downstream/release.json Downstream/CHANGELOG.md
          
          VERSION="$(bun -e 'const m = JSON.parse(require("fs").readFileSync("Downstream/release.json")); console.log(m.upstreamTag.slice(1) + "-d." + m.revision);')"
          git commit -m "chore(release): prepare Lattice ${VERSION}"
          git push origin lattice/main

          COMMIT_SHA="$(git rev-parse HEAD)"
          echo "commit=$COMMIT_SHA" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

