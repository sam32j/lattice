name: Lattice downstream

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - lattice/main
    paths:
      - 'Downstream/release.json'

permissions: {}
concurrency:
  group: lattice-downstream
  cancel-in-progress: false

jobs:
  sync:
    if: (github.repository == 'sam32j/lattice' || github.repository == 'sam32j/vorssaint-utils') && (github.ref == 'refs/heads/lattice/main' || github.ref == 'refs/heads/dev-build/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.sync.outputs.commit }}
      ready: ${{ steps.sync.outputs.ready }}
      changed: ${{ steps.sync.outputs.changed }}
      pending: ${{ steps.pending.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Sync tracking main and rebase personal patches
        id: sync
        env:
          GH_TOKEN: ${{ secrets.LATTICE_SYNC_TOKEN || github.token }}
        run: |
          set -euo pipefail
          gh auth setup-git
          TAG="$(gh api repos/vorssaint/vorssaint-utils/releases/latest --jq '.tag_name')"
          bun Tools/sync-downstream.ts \
            --fork https://github.com/sam32j/lattice.git \
            --upstream https://github.com/vorssaint/vorssaint-utils.git \
            --upstream-tag "$TAG"
      - name: Check whether this release already exists
        id: pending
        if: steps.sync.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LATTICE_TAG: ${{ steps.sync.outputs.tag }}
        run: bun Tools/lattice-release-pending.ts
      - name: Record sync result
        env:
          READY: ${{ steps.sync.outputs.ready }}
          HELD: ${{ steps.sync.outputs.held }}
        run: |
          printf 'Release eligible: %s\n%s\n' "$READY" "$HELD" >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: sync
    if: needs.sync.outputs.ready == 'true' && needs.sync.outputs.pending == 'true' && vars.LATTICE_RELEASES_ENABLED == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/lattice-release.yml
    with:
      commit: ${{ needs.sync.outputs.commit }}
    secrets: inherit
