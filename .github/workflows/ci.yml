name: CI

on:
  push:
    branches: [main, lattice/main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'TRADEMARKS.md'
      - 'SECURITY.md'
      - 'SUPPORT.md'
      - '.gitignore'
      - 'Downstream/**'
      - '.github/workflows/downstream.yml'
      - '.github/workflows/issue-fix-status.yml'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - 'TRADEMARKS.md'
      - 'SECURITY.md'
      - 'SUPPORT.md'
      - '.gitignore'
      - 'Downstream/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.4.2"
      - uses: astral-sh/setup-uv@c97f06e356bcca1b426f396ef93ec35ce149ce7b
        with:
          enable-cache: false

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Lattice --selftest

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Downstream workflow tests
        run: bun test Tests/downstream-sync.test.ts Tests/lattice-release.test.ts

      - name: Unit tests
        run: ./build.sh --test
